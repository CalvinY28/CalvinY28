<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Project Splash Art</title>
  <link rel="icon" href="../Images/HeartUIFull.png" />
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/BlockBenchBuild.loader.js"></script>
    <script>
		// Make canvas fill the window on ALL devices
		var canvas = document.querySelector("#unity-canvas");
		canvas.style.width = "100%";
		canvas.style.height = "100%";
		canvas.style.position = "fixed";
		canvas.style.top = "0";
		canvas.style.left = "0";
		canvas.style.margin = "0";
		document.body.style.margin = "0";
		document.body.style.padding = "0";
		document.body.style.overflow = "hidden";

		// Optional: still add the mobile viewport meta for phones
		if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
			var meta = document.createElement('meta');
			meta.name = 'viewport';
			meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
			document.getElementsByTagName('head')[0].appendChild(meta);
		}

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/BlockBenchBuild.data",
        frameworkUrl: "Build/BlockBenchBuild.framework.js",
        codeUrl: "Build/BlockBenchBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "BlockBenchUnity",
        productVersion: "0.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>

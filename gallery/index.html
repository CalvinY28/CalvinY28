<!DOCTYPE html>

<!-- THIS IS THE HTML FOR THE GALLERY PAGE -->

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Calvin Yang</title>
  <link rel="icon" href="Images/cat.jpg" />

  <style>
    :root {
      --bg: #f3f3f3;
      --text: #111;
      --accent: #333;
      --font: "Segoe UI", sans-serif;
    }

    body.dark {
      --bg: #121212;
      --text: #f3f3f3;
      --accent: #ddd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    /* --- HEADER --- */
    header {
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	  padding: 0.8rem 2rem;
	  border: 2px solid var(--accent);
	  border-radius: 50px;
	  max-width: 1300px;
	  margin: 1rem auto;
	  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
	  position: sticky;
	  top: 2rem;
	  z-index: 1000;
      margin: 0 auto;
	  transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
	  will-change: transform;
		
	  background: rgba(255, 255, 255, 0.2);
	  backdrop-filter: blur(8px) saturate(140%);
	  -webkit-backdrop-filter: blur(8px) saturate(140%);

	  transition: background 0.3s, border-color 0.3s, transform 0.2s;
    }
	  
	body.dark header {
	  background: rgba(18, 18, 18, 0.4);
	  border-color: rgba(255, 255, 255, 0.2);
	}

    header h1 {
      font-size: 2rem;
      margin: 0;
    }
	  
	header h1 a {
	  text-decoration: none;
	  color: var(--text);
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    .nav-btn {
      background: none;
      border: 2px solid var(--accent);
      color: var(--text);
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
      text-decoration: none;
      display: inline-block;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* SUBNAV */
    .subnav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 4rem 0 1rem 0;
    }

    .subnav-btn {
      background: none;
      border: 2px solid var(--accent);
      color: var(--text);
      border-radius: 6px;
      padding: 0.4rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }

    .subnav-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* GALLERY GRID */
    .gallery-section {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .gallery-section.active {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto 3rem auto;
    }

    .gallery-item {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .dark .gallery-item {
      background: #222;
      box-shadow: 0 4px 10px rgba(255,255,255,0.1);
    }

    .gallery-item:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    .gallery-item img {
      width: 100%;
      display: block;
    }

    .gallery-item p {
      text-align: center;
      padding: 0.8rem;
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.6;
      margin-top: 3rem;
      padding-bottom: 2rem;
    }

    /* LIGHT/DARK TOGGLE */
    #theme-toggle {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      cursor: pointer;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background 0.3s, transform 0.2s;
      z-index: 2000;
    }

    #theme-toggle:hover {
      transform: scale(1.1);
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
    }
	
	/* --- Desciprtions --- */
	.gallery-description {
	  text-align: center;
	  font-size: 1.1rem;
	  margin: 0.5rem auto 2rem auto;
	  color: var(--text);
	  opacity: 0.85;
	  transition: opacity 0.3s ease, transform 0.3s ease;
	}

	.gallery-description.fade {
	  opacity: 0;
	  transform: translateY(-5px);
	}

	/* --- Animations --- */
	.character {
	  position: fixed;
	  bottom: 20px;
	  left: 100px;
	  width: 80px;
	  height: auto;
	  z-index: 999;
	  pointer-events: none;
	  transform-origin: center;
	  transition: transform 0.2s;
	  image-rendering: pixelated;
	}
	.character:nth-child(1) { left: 100px; }
	.character:nth-child(2) { left: 250px; }
	.character:nth-child(3) { left: 400px; }
	  
  </style>
</head>

<body>
  <header>
    <h1><a href="/" style="text-decoration:none; color:inherit;">Calvin Yang</a></h1>
    <nav>
      <a href="/" class="nav-btn">Work</a>
      <a href="/gallery" class="nav-btn"><strong>Gallery</strong></a>
      <a href="/about" class="nav-btn">About</a>
    </nav>
  </header>

  <main>
    <h2></h2>

    <div class="subnav">
      <button class="subnav-btn" data-target="art">Art</button>
      <button class="subnav-btn" data-target="sound">Sound</button>

	  A collection of my artwork, exploring form and texture.

    <!-- ART SECTION -->
    <section id="art" class="gallery-section active">
      <div class="gallery-item">

      </div>
      <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 2">
        <p>Art Piece 2</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 3">
        <p>Art Piece 3</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 4">
        <p>Art Piece 4</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 5">
        <p>Art Piece 5</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 3">
        <p>Art Piece 3</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 4">

    <!-- SOUND SECTION -->
    <section id="sound" class="gallery-section">
      <div class="gallery-item">

    </section>
  </main>

  <footer>
    © 2025 Calvin Yang — All Rights Reserved
  </footer>

  <button id="theme-toggle" aria-label="Toggle theme">🌙</button>

	<script>
	  const body = document.body;
	  const toggleBtn = document.getElementById('theme-toggle');

	  // Theme persistence
	  const savedTheme = localStorage.getItem('theme');
	  if (savedTheme === 'dark') {
		body.classList.add('dark');
		toggleBtn.textContent = '☀️';
	  }

	  toggleBtn.addEventListener('click', () => {
		body.classList.toggle('dark');
		const isDark = body.classList.contains('dark');
		toggleBtn.textContent = isDark ? '☀️' : '🌙';
		localStorage.setItem('theme', isDark ? 'dark' : 'light');
	  });

	  // Tab switching
	  const subnavButtons = document.querySelectorAll('.subnav-btn');
	  const sections = document.querySelectorAll('.gallery-section');
	  const desc = document.getElementById('gallery-description');

	  const descriptions = {
		art: "A collection of my artwork, exploring form and space.",
		sound: "Audio design projects showcasing creative sound manipulation and mixing.",
		music: "Original compositions and experimental tracks created over time."
	  };

	  subnavButtons.forEach(btn => {
		btn.addEventListener('click', () => {
		  const target = btn.getAttribute('data-target');
		  sections.forEach(sec => sec.classList.remove('active'));
		  document.getElementById(target).classList.add('active');

		  // Fade out description, swap, then fade in
		  desc.classList.add('fade');
		  setTimeout(() => {
			desc.textContent = descriptions[target];
			desc.classList.remove('fade');
		  }, 250);
		});
	  });
	</script>

	
	<!-- Bouncy Header -->
	<script>
		let lastScroll = 0;
		let velocity = 0;
		let targetY = 0;
		let currentY = 0;

		function lerp(a, b, t) {
		  return a + (b - a) * t;
		}

		window.addEventListener("scroll", () => {
		  const scrollY = window.scrollY;
		  const delta = scrollY - lastScroll;
		  velocity += delta * 0.25; // scroll influence
		  lastScroll = scrollY;
		});

		function animateHeader() {
		  targetY += velocity;
		  velocity *= 0.8; // friction
		  targetY *= 0.4; // spring back
		  currentY = lerp(currentY, targetY, 0.2);

		  // trying to stretch and squash
		  const stretch = 1 - Math.min(Math.abs(velocity) * 0.01, 0.15);
		  const scaleY = velocity > 0 ? stretch : 1 / stretch;

		  const header = document.querySelector("header");
		  header.style.transform = `translateY(${currentY}px) scaleY(${scaleY})`;

		  requestAnimationFrame(animateHeader);
		}
		animateHeader();
	</script>
	
	<!-- Character -->
	<script>
		document.addEventListener("DOMContentLoaded", () => {
		  const characters = document.querySelectorAll(".character");

		  // load saved positions
		  const savedData = JSON.parse(localStorage.getItem("characterPositions") || "[]");

		  const states = Array.from(characters).map((char, i) => ({
			el: char,
			posX: savedData[i]?.posX ?? (100 + i * 120), // restore or default
			direction: savedData[i]?.direction ?? (Math.random() < 0.5 ? -1 : 1),
			speed: savedData[i]?.speed ?? (Math.random() * 1.5 + 1),
			nextDirectionChange: Date.now() + 2000 + Math.random() * 3000
		  }));

		  function randomInRange(min, max) {
			return Math.random() * (max - min) + min;
		  }

		  function walk() {
			const now = Date.now();

			states.forEach((state, i) => {
			  // randomly change direction and speed
			  if (now > state.nextDirectionChange) {
				state.direction = Math.random() < 0.5 ? -1 : 1;
				state.speed = randomInRange(1, 2.5);
				state.nextDirectionChange = now + 2000 + Math.random() * 4000;
			  }

			  // move horizontally
			  state.posX += state.direction * state.speed;

			  // bounce off edges
			  if (state.posX < 20) {
				state.posX = 20;
				state.direction = 1;
			  }
			  if (state.posX > window.innerWidth - 100) {
				state.posX = window.innerWidth - 100;
				state.direction = -1;
			  }

			  // apply transform and position
			  state.el.style.left = state.posX + "px";
			  state.el.style.transform = `scaleX(${state.direction})`;

			  // save every few frames (throttled)
			  if (i === characters.length - 1 && now % 20 < 1) {
				localStorage.setItem(
				  "characterPositions",
				  JSON.stringify(
					states.map(s => ({
					  posX: s.posX,
					  direction: s.direction,
					  speed: s.speed
					}))
				  )
				);
			  }
			});

			requestAnimationFrame(walk);
		  }

		  walk();
		});
	</script>

	<img class="character" src="../Images/cat.gif" alt="a">
	<img class="character" src="../Images/cat.gif" alt="b">
	<img class="character" src="../Images/cat.gif" alt="c">

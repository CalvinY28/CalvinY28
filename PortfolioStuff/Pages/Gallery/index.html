<!DOCTYPE html>

<!-- THIS IS THE HTML FOR THE GALLERY PAGE -->

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Calvin Yang</title>
  <link rel="icon" href="Images/cat.jpg" />

  <style>
    :root {
      --bg: #f3f3f3;
      --text: #111;
      --accent: #333;
      --font: "Segoe UI", sans-serif;
    }

    body.dark {
      --bg: #121212;
      --text: #f3f3f3;
      --accent: #ddd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    /* --- HEADER --- */
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0rem;
      border-bottom: 2px solid var(--accent);
      z-index: 1000;
      max-width: 1290px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 2rem;
      margin: 0;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    .nav-btn {
      background: none;
      border: 2px solid var(--accent);
      color: var(--text);
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
      text-decoration: none;
      display: inline-block;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* SUBNAV */
    .subnav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0 1rem 0;
    }

    .subnav-btn {
      background: none;
      border: 2px solid var(--accent);
      color: var(--text);
      border-radius: 6px;
      padding: 0.4rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }

    .subnav-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* GALLERY GRID */
    .gallery-section {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .gallery-section.active {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto 3rem auto;
    }

    .gallery-item {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .dark .gallery-item {
      background: #222;
      box-shadow: 0 4px 10px rgba(255,255,255,0.1);
    }

    .gallery-item:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    .gallery-item img {
      width: 100%;
      display: block;
    }

    .gallery-item p {
      text-align: center;
      padding: 0.8rem;
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.6;
      margin-top: 3rem;
      padding-bottom: 2rem;
    }

    /* LIGHT/DARK TOGGLE */
    #theme-toggle {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      cursor: pointer;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background 0.3s, transform 0.2s;
      z-index: 2000;
    }

    #theme-toggle:hover {
      transform: scale(1.1);
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1><a href="/CalvinY28/" style="text-decoration:none; color:inherit;">Calvin Yang</a></h1>
    <nav>
      <a href="/CalvinY28/" class="nav-btn">Work</a>
      <a href="/CalvinY28/gallery" class="nav-btn"><strong>Gallery</strong></a>
      <a href="/CalvinY28/about" class="nav-btn">About</a>
    </nav>
  </header>

  <main>
    <h2></h2>

    <div class="subnav">
      <button class="subnav-btn" data-target="art">Art</button>
      <button class="subnav-btn" data-target="sound">Sound</button>
      <button class="subnav-btn" data-target="music">Music</button>
    </div>

    <!-- ART SECTION -->
    <section id="art" class="gallery-section active">
      <div class="gallery-item">
        <img src="Images/art1.jpg" alt="Art 1">
        <p>Art Piece 1</p>
      </div>
      <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 2">
        <p>Art Piece 2</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 3">
        <p>Art Piece 3</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 4">
        <p>Art Piece 4</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 5">
        <p>Art Piece 5</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 3">
        <p>Art Piece 3</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 4">
        <p>Art Piece 4</p>
      </div>
	  <div class="gallery-item">
        <img src="Images/art2.jpg" alt="Art 5">
        <p>Art Piece 5</p>
      </div>
    </section>

    <!-- SOUND SECTION -->
    <section id="sound" class="gallery-section">
      <div class="gallery-item">
        <audio controls style="width:100%;">
          <source src="Sounds/sound1.mp3" type="audio/mpeg">
        </audio>
        <p>Sound Design 1</p>
      </div>
    </section>

    <!-- MUSIC SECTION -->
    <section id="music" class="gallery-section">
      <div class="gallery-item">
        <audio controls style="width:100%;">
          <source src="Music/music1.mp3" type="audio/mpeg">
        </audio>
        <p>Track 1</p>
      </div>
    </section>
  </main>

  <footer>
    © 2025 Calvin Yang — All Rights Reserved
  </footer>

  <button id="theme-toggle" aria-label="Toggle theme">🌙</button>

  <script>
  const body = document.body;
  const toggleBtn = document.getElementById('theme-toggle');

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    body.classList.add('dark');
    toggleBtn.textContent = '☀️';
  }

  toggleBtn.addEventListener('click', () => {
    body.classList.toggle('dark');
    const isDark = body.classList.contains('dark');
    toggleBtn.textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });

  const subnavButtons = document.querySelectorAll('.subnav-btn');
  const sections = document.querySelectorAll('.gallery-section');

  subnavButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.getAttribute('data-target');
      sections.forEach(sec => sec.classList.remove('active'));
      document.getElementById(target).classList.add('active');
    });
  });
</script>

</body>
</html>
